[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cognio"
version = "0.1.0"
description = "Local online luminance prediction and measured neural activations"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "torch>=2.9,<3", "PySide6>=6.8,<7", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cognio = "cognio.__main__:main"

[tool.setuptools.packages.find]
include = ["cognio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
